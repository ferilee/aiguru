name: Build and Push GHCR (Manual)

on:
  workflow_dispatch:
    inputs:
      next_public_app_url:
        description: "Public app URL for metadata/callback links"
        required: false
        default: "http://localhost:3005"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ferilee/aiguru:latest
            ghcr.io/ferilee/aiguru:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ inputs.next_public_app_url }}
